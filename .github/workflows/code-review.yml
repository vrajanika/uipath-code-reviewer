name: UiPath Code Review Bot

on:
  # Allow this workflow to be called from other repositories
  workflow_call:
    inputs:
      repository:
        description: 'Repository name (owner/repo)'
        required: true
        type: string
      pr-number:
        description: 'Pull request number'
        required: true
        type: number
      all-files:
        description: 'Review all files instead of just UiPath files'
        required: false
        type: boolean
        default: false
    secrets:
      AZURE_OPENAI_ENDPOINT:
        description: 'Azure OpenAI endpoint URL'
        required: true
      AZURE_OPENAI_API_KEY:
        description: 'Azure OpenAI API key'
        required: true
      AZURE_OPENAI_DEPLOYMENT_NAME:
        description: 'Azure OpenAI deployment/model name'
        required: true
      AZURE_OPENAI_API_VERSION:
        description: 'Azure OpenAI API version'
        required: false
      GH_TOKEN:
        description: 'GitHub token for API access'
        required: true

  # Keep existing triggers for local use
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  code-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Only run on PR comments that mention the bot (for local triggers)
    # Always run for workflow_call
    if: |
      (github.event_name == 'workflow_call') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@uipath-reviewer'))

    steps:
      - name: Checkout code (for workflow_call)
        if: github.event_name == 'workflow_call'
        uses: actions/checkout@v4
        with:
          repository: kangtamo/uipath-code-reviewer
          path: uipath-code-reviewer

      - name: Checkout code (for local triggers)
        if: github.event_name != 'workflow_call'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ github.event_name }}" == "workflow_call" ]; then
            pip install -r uipath-code-reviewer/requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Run code review
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION || '2024-02-15-preview' }}
          GITHUB_TOKEN: ${{ github.event_name == 'workflow_call' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_call" ]; then
            cd uipath-code-reviewer
            REPO="${{ inputs.repository }}"
            PR_NUM="${{ inputs.pr-number }}"
            ALL_FILES_FLAG="${{ inputs.all-files == true && '--all-files' || '' }}"
          else
            REPO="${{ github.repository }}"
            PR_NUM="${{ github.event.pull_request.number || github.event.issue.number }}"
            ALL_FILES_FLAG=""
          fi

          python -m bot.main \
            --repo "$REPO" \
            --pr-number "$PR_NUM" \
            $ALL_FILES_FLAG

      - name: Post review result
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.event_name == 'workflow_call' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Determine file path based on event type
            const filePath = '${{ github.event_name }}' === 'workflow_call'
              ? 'uipath-code-reviewer/review_result.txt'
              : 'review_result.txt';

            // Check if review output exists
            if (fs.existsSync(filePath)) {
              const reviewBody = fs.readFileSync(filePath, 'utf8');

              // Get repository and PR info
              let owner, repo, issueNumber;
              if ('${{ github.event_name }}' === 'workflow_call') {
                const repoFullName = '${{ inputs.repository }}';
                [owner, repo] = repoFullName.split('/');
                issueNumber = ${{ inputs.pr-number }};
              } else {
                owner = context.repo.owner;
                repo = context.repo.repo;
                issueNumber = context.payload.pull_request?.number || context.payload.issue.number;
              }

              // Post as a comment
              await github.rest.issues.createComment({
                owner: owner,
                repo: repo,
                issue_number: issueNumber,
                body: reviewBody
              });
            }
